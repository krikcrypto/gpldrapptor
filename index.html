<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Gold Tapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d0d0f;font-family:'Bebas Neue',sans-serif;user-select:none}
.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 30%,rgba(165,118,36,0.15),transparent 60%),linear-gradient(180deg,#141416 0%,#0a0a0c 100%)}
.topbar{padding:16px;display:flex;justify-content:center}
.gold-block{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:12px;background:linear-gradient(135deg,#a57624,#6f4a13);box-shadow:0 4px 16px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,202,145,0.25);border:1px solid rgba(255,202,145,0.15)}
.gold-icon-wrap{width:34px;height:34px;border-radius:8px;background:#51350d;display:flex;align-items:center;justify-content:center}
.gold-icon{color:#ffca91;font-size:16px}
.gold-amount{color:#ffca91;font-size:26px;letter-spacing:1px;text-shadow:0 1px 2px rgba(0,0,0,0.6);min-width:60px;text-align:center}
.tap-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;position:relative}
.coin{width:200px;height:200px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:radial-gradient(circle at 35% 30%,#ffca91,#a57624 55%,#6f4a13 100%);box-shadow:0 0 0 6px rgba(81,53,13,0.6),0 0 60px rgba(255,202,145,0.35),inset 0 -8px 20px rgba(0,0,0,0.35),inset 0 8px 20px rgba(255,255,255,0.15);transition:transform 0.08s ease;animation:float 3s ease-in-out infinite}
.coin:active{transform:scale(0.92)}
.coin-inner{font-size:72px;color:#51350d;text-shadow:0 2px 4px rgba(255,255,255,0.3)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hint{color:rgba(255,202,145,0.5);font-size:20px;letter-spacing:2px;text-transform:uppercase}
.plus-one{position:absolute;color:#ffca91;font-size:32px;pointer-events:none;text-shadow:0 0 12px rgba(255,202,145,0.8);animation:rise 0.9s ease-out forwards}
@keyframes rise{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-120px) scale(1.3)}}
.bottombar{padding:16px 20px calc(20px + env(safe-area-inset-bottom))}
.withdraw-btn{width:100%;padding:18px;font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#ffca91;background:linear-gradient(135deg,#a57624,#6f4a13);border:1px solid rgba(255,202,145,0.3);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,202,145,0.3);cursor:pointer;transition:transform 0.08s ease,filter 0.15s ease}
.withdraw-btn:active{transform:scale(0.97);filter:brightness(1.15)}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<div class="gold-block">
<div class="gold-icon-wrap"><div class="gold-icon">◆</div></div>
<div class="gold-amount" id="balance">0</div>
</div>
</header>
<main class="tap-area" id="tapArea">
<div class="coin" id="coin"><div class="coin-inner">◆</div></div>
<p class="hint">Тапай по голде</p>
</main>
<footer class="bottombar">
<button class="withdraw-btn" id="withdrawBtn">Вывести голду</button>
</footer>
</div>
<script>
const balanceEl=document.getElementById('balance');
const coin=document.getElementById('coin');
const tapArea=document.getElementById('tapArea');
const withdrawBtn=document.getElementById('withdrawBtn');
const GAIN=0.5;
const SUPPORT_USERNAME='mestdead';
const MIN_WITHDRAW=10;
let balance=Number(localStorage.getItem('gold_balance')||0);
render();
function render(){balanceEl.textContent=formatNumber(balance)}
function formatNumber(n){const rounded=Math.round(n*10)/10;const parts=rounded.toString().split('.');const intFormatted=Number(parts[0]).

Mailz:
toLocaleString('ru-RU');return parts[1]?intFormatted+'.'+parts[1]:intFormatted}
function save(){localStorage.setItem('gold_balance',balance)}
function spawnPlus(x,y,amount){const el=document.createElement('div');el.className='plus-one';el.textContent='+'+amount;el.style.left=x+'px';el.style.top=y+'px';el.style.transform='translate(-50%,-50%)';tapArea.appendChild(el);setTimeout(()=>el.remove(),900)}
coin.addEventListener('pointerdown',(e)=>{e.preventDefault();balance+=GAIN;render();save();spawnPlus(e.clientX,e.clientY,GAIN);if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback){window.Telegram.WebApp.HapticFeedback.impactOccurred('light')}});
withdrawBtn.addEventListener('click',()=>{if(balance<MIN_WITHDRAW){alert('Минимум для вывода: '+MIN_WITHDRAW+' голды');return}const message='Здравствуйте! Хочу вывести голду. Мой баланс: '+formatNumber(balance)+' голды.';const link='https://t.me/'+SUPPORT_USERNAME+'?text='+encodeURIComponent(message);if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.openTelegramLink){window.Telegram.WebApp.openTelegramLink(link)}else{window.open(link,'_blank')}});
if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}
</script>
</body>
</html>
