<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gold Tapper</title>
<style>
body { margin: 0; background: #141416; color: #ffca91; font-family: sans-serif; text-align: center; height: 100vh; display: flex; flex-direction: column; }
.header { padding: 20px; font-size: 30px; }
.main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.coin { width: 150px; height: 150px; background: #a57624; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 60px; color: #51350d; cursor: pointer; }
.btn { margin: 20px; padding: 15px; background: #a57624; color: #ffca91; border: none; font-size: 20px; border-radius: 10px; }
</style>
</head>
<body>
<div class="header">Баланс: <span id="bal">0.0</span></div>
<div class="main">
<div class="coin" id="coin">◆</div>
</div>
<button class="btn" id="btn">ВЫВЕСТИ</button>

<script>
var b = Number(localStorage.getItem('g') || 0);
var el = document.getElementById('bal');
el.innerText = b === 0 ? "0.0" : b;

document.getElementById('coin').onclick = function() {
b = b + 0.5;
localStorage.setItem('g', b);
el.innerText = b;
};

document.getElementById('btn').onclick = function() {
if (b < 10) { alert('Нужно 10 голды'); return; }
var link = 'https://t.me/mestdead?text=Хочу вывести ' + b + ' голды';
if (window.Telegram && window.Telegram.WebApp) {
window.Telegram.WebApp.openTelegramLink(link);
} else {
window.open(link, '_blank');
}
};
</script>
</body>
</html>
