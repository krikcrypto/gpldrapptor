<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gold Tapper</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
body { margin: 0; height: 100vh; background: #0d0d0f; font-family: 'Bebas Neue', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; }
.header { padding: 20px; text-align: center; }
.balance { display: inline-block; padding: 10px 20px; background: #a57624; color: #ffca91; border-radius: 10px; font-size: 26px; border: 1px solid #51350d; }
.main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
.coin { width: 180px; height: 180px; border-radius: 50%; background: #a57624; display: flex; align-items: center; justify-content: center; font-size: 60px; color: #51350d; cursor: pointer; transition: 0.1s; }
.coin:active { transform: scale(0.9); }
.text { color: #ffca91; font-size: 20px; letter-spacing: 2px; }
.footer { padding: 20px; }
.btn { width: 100%; padding: 15px; background: #a57624; color: #ffca91; border: none; border-radius: 10px; font-family: 'Bebas Neue', sans-serif; font-size: 22px; cursor: pointer; }
.plus { position: absolute; color: #ffca91; font-size: 30px; pointer-events: none; animation: up 1s forwards; }
@keyframes up { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
</style>
</head>
<body>
<div class="header">
<div class="balance" id="bal">0</div>
</div>
<div class="main" id="main">
<div class="coin" id="coin">◆</div>
<div class="text">ТАПАЙ</div>
</div>
<div class="footer">
<button class="btn" id="btn">ВЫВЕСТИ ГОЛДУ</button>
</div>
<script>
var bal = Number(localStorage.getItem('g') || 0);
var balEl = document.getElementById('bal');
balEl.innerText = bal + (bal === 0 ? ".0" : "");

document.getElementById('coin').onclick = function(e) {
bal += 0.5;
localStorage.setItem('g', bal);
balEl.innerText = bal;
var el = document.createElement('div');
el.className = 'plus';
el.innerText = '+0.5';
el.style.left = (e.clientX || 50) + 'px';
el.style.top = (e.clientY || 50) + 'px';
document.body.appendChild(el);
setTimeout(function() { el.remove(); }, 1000);
};

document.getElementById('btn').onclick = function() {
if (bal < 10) { alert('Нужно 10 голды!'); return; }
var link = 'https://t.me/mestdead?text=' + encodeURIComponent('Мой баланс: ' + bal + ' голды. Хочу вывести.');
if (window.Telegram && window.Telegram.WebApp) {
window.Telegram.WebApp.openTelegramLink(link);
} else {
window.open(link, '_blank');
}
};

if (window.Telegram && window.Telegram.WebApp) {
window.Telegram.WebApp.ready();
}
</script>
</body>
</html>
